# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

# The Dependabot proxy only lets the helm updater reach chart repositories that are on
# its built-in egress allowlist or declared here; others fail with
# "egress not allowlisted <host>" (403) and are silently never checked.
# All of these are public. GitHub rejects a helm-registry entry without credentials,
# so placeholder anonymous credentials are used; public chart repos ignore them.
registries:
  awx-operator:
    type: helm-registry
    url: https://ansible-community.github.io/awx-operator-helm
    username: anonymous
    password: anonymous
  alekc:
    type: helm-registry
    url: https://charts.alekc.dev
    username: anonymous
    password: anonymous
  gabe565:
    type: helm-registry
    url: https://charts.gabe565.com
    username: anonymous
    password: anonymous
  community-charts:
    type: helm-registry
    url: https://community-charts.github.io/helm-charts
    username: anonymous
    password: anonymous
  germanium-git:
    type: helm-registry
    url: https://germanium-git.github.io/helm-charts
    username: anonymous
    password: anonymous
  helm-examples:
    type: helm-registry
    url: https://helm.github.io/examples
    username: anonymous
    password: anonymous
  istio:
    type: helm-registry
    url: https://istio-release.storage.googleapis.com/charts
    username: anonymous
    password: anonymous
  jupyterhub:
    type: helm-registry
    url: https://jupyterhub.github.io/helm-chart
    username: anonymous
    password: anonymous
  metallb:
    type: helm-registry
    url: https://metallb.github.io/metallb
    username: anonymous
    password: anonymous
  xwiki:
    type: helm-registry
    url: https://xwiki-contrib.github.io/xwiki-helm
    username: anonymous
    password: anonymous

updates:
  # Upstream Helm charts wrapped as dependencies in apps/<app>/Chart.yaml
  - package-ecosystem: "helm"
    directories:
      - "/apps/*"
    registries: "*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # The helm ecosystem also bumps image tags found in values.yaml, so repeat the image rules here.
    ignore:
      # 93.0.0 ships prometheus-operator v0.95.1, published for linux/amd64 only (nodes are arm64):
      # https://github.com/prometheus-operator/prometheus-operator/issues/8953 - remove once fixed.
      - dependency-name: "kube-prometheus-stack"
        versions: ["93.0.0"]
      - dependency-name: "*xwiki"
        versions: [">= 17.11, < 18.10"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Container images pinned in plain manifests / values files
  - package-ecosystem: "docker"
    directories:
      - "/apps/xwiki"
      - "/apps/xwiki/addons"
      - "/apps/pgsql/templates"
      - "/apps/telegraf"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Prague"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # XWiki: follow the LTS line only. Allows 17.10.x patches and the next LTS (18.10.x).
      # When on 18.10, move the range to the next gap: [">= 18.11, < 19.10"].
      - dependency-name: "*xwiki"
        versions: [">= 17.11, < 18.10"]
      # PostgreSQL: a major upgrade needs dump/restore, never propose it automatically.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
