apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: argo
    notifications.argoproj.io/subscribe.on-health-degraded.slack: argo
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argo
    notifications.argoproj.io/subscribe.on-sync-status-unknown.slack: argo
spec:
  project: default
  source:
    repoURL: https://github.com/germanium-git/argocd
    path: apps/prometheus-operator-crds
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /status
    jqPathExpressions:
    - .spec.versions[].selectableFields
  syncPolicy:
    syncOptions:
    # The CRDs are too large for client-side apply (last-applied annotation limit)
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
