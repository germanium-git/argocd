# Scrape telegraf's own metrics (inputs.internal -> outputs.prometheus_client :9273)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: telegraf
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: telegraf
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: telegraf
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: telegraf
      rules:
        - alert: TelegrafInfluxDBWriteErrors
          expr: sum(increase(internal_write_errors{namespace="telegraf",output="influxdb_v2"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Telegraf cannot write SNMP metrics to InfluxDB
            description: Writes to https://apollo.germanium.cz:8086 have been failing for 15+ minutes. Check InfluxDB on apollo (service, /data mount, TLS cert).
        - alert: TelegrafSNMPGatherErrors
          expr: sum(increase(internal_gather_errors{namespace="telegraf",input="snmp"}[15m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Telegraf SNMP polling errors
            description: At least one SNMP agent (SRX 172.31.1.1, Dell switch 172.31.1.197, LTE modem 192.168.1.1) failed to answer for 30+ minutes.
        - alert: TelegrafDown
          expr: absent(up{namespace="telegraf"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Telegraf is not running or not scraped
