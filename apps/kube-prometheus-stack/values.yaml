kube-prometheus-stack:
  ## CRDs are managed by the separate Argo app apps/prometheus-operator-crds (sync that one first on upgrades).
  crds:
    enabled: false
  ## Component scraping kube scheduler
  kubeScheduler:
    enabled: false
  ## Component scraping etcd
  kubeEtcd:
    enabled: false
  ## Component scraping kubeDns. Use either this or coreDns
  kubeDns:
    enabled: false
  ## Component scraping coreDns. Use either this or kubeDns
  coreDns:
    enabled: false
  ## Component scraping the kube controller manager
  kubeControllerManager:
    enabled: false
  ## Component scraping kube proxy
  kubeProxy:
    enabled: false
  ## Component scraping the kubelet and kubelet-hosted cAdvisor
  kubelet:
    enabled: true
  alertmanager:
    service:
      type: LoadBalancer
    ## Alerts of severity warning or critical, from all namespaces, go to Slack #alerts-k8s.
    ## The bot token is the Argo CD notifications bot, sealed in templates/alertmanager-slack-bot-sealedsecret.yaml
    ## and mounted via alertmanagerSpec.secrets. The bot must be a member of the channel.
    ## inhibit_rules come from the chart defaults (Helm merges maps; route and receivers are replaced).
    config:
      route:
        receiver: "null"
        group_by: [namespace, alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: "null"
            matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
          - receiver: slack
            matchers: ['severity =~ "warning|critical"']
      receivers:
        - name: "null"
        - name: slack
          slack_configs:
            - api_url: https://slack.com/api/chat.postMessage
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/alertmanager-slack-bot/token
              channel: "#alerts-k8s"
              send_resolved: true
              title: >-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
                {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} in {{ . }}{{ end }}
              text: |-
                {{ range .Alerts -}}
                *{{ .Labels.severity | toUpper }}* {{ with .Annotations.summary }}{{ . }}{{ else }}{{ .Annotations.message }}{{ end }}
                {{ with .Annotations.description }}{{ . }}{{ end }}
                {{ with .Annotations.runbook_url }}<{{ . }}|Runbook>{{ end }}
                {{ end }}
    alertmanagerSpec:
      secrets:
        - alertmanager-slack-bot
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: nfs-atlas
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      securityContext:
        # runAsGroup: 2000
        # runAsNonRoot: true
        # runAsUser: 1000
        fsGroup: 2000
  grafana:
    enabled: true
    # Admin credentials from SealedSecret templates/grafana-admin-sealedsecret.yaml.
    # Newer charts have no default adminPassword and would generate a random one on every
    # render (permanent OutOfSync in Argo CD and a rotating password).
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # HTTPRoute on the Cloudflare Tunnel gateway (remote via the tunnel behind Cloudflare
    # Access, LAN via the SRX300 DNS entry grafana.germanium.cz -> 172.31.1.34).
    # TLS uses the germanium.cz wildcard cert on the gateway.
    ingress:
      enabled: false
    route:
      main:
        enabled: true
        annotations:
          external-dns.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - grafana.germanium.cz
        parentRefs:
          - name: traefik-gateway-tls-tunnel
            namespace: traefik
            sectionName: websecure
    additionalDataSources:
    - name: loki-gateway
      access: proxy
      basicAuth: false
      editable: false
      jsonData:
        manageAlerts: false
        maxLines: 1000
      orgId: 1
      type: loki
      url: http://loki-gateway.logging.svc.cluster.local
      version: 1
    serviceMonitor:
      labels:
        release: kube-prometheus-stack
  prometheus:
    service:
      type: LoadBalancer
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: nfs-atlas
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      securityContext:
        # runAsGroup: 2000
        # runAsNonRoot: true
        # runAsUser: 1000
        fsGroup: 1000 
