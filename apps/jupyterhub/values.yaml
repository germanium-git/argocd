jupyterhub:
  hub:
    # annotations:
    #   argocd.argoproj.io/health: "Healthy"
    db:
      pvc:
        storageClassName: nfs-atlas
        storage: 8Gi

    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 1000
  
  # HTTPS via Traefik: templates/httproute.yaml routes jupyter.germanium.cz to proxy-public.
  # No LoadBalancer IP any more (it served plain HTTP on 172.31.1.38).
  proxy:
    service:
      type: ClusterIP


  prePuller:
    hook:
      enabled: false
    continuous:
      enabled: false

  singleuser:
    storage:
      dynamic:
        storageClass: nfs-atlas

  scheduling:
    # The user scheduler packs user pods onto as few nodes as possible, for autoscaling clusters.
    # Not useful on 3 fixed nodes; its 2 replicas renewed a lease every 2 s (about 0.5 etcd writes/s).
    # User pods and the placeholder use the default scheduler instead.
    userScheduler:
      enabled: false
    userPlaceholder:
      replicas: 1
