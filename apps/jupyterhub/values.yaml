jupyterhub:
  hub:
    # annotations:
    #   argocd.argoproj.io/health: "Healthy"
    db:
      pvc:
        storageClassName: nfs-atlas
        storage: 8Gi

    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 1000

    # Real accounts instead of the chart's default DummyAuthenticator (which let anyone log in with
    # any name and password). Users sign up at /hub/signup; the admin approves them at /hub/authorize.
    # Passwords are stored hashed in the hub database (PVC hub-db-dir). Each user gets a volume
    # claim-<username>.
    config:
      JupyterHub:
        authenticator_class: native
      Authenticator:
        admin_users:
          - petr
      NativeAuthenticator:
        open_signup: false              # new accounts wait for admin approval
        minimum_password_length: 12
        check_common_password: true     # reject the most common passwords
        allowed_failed_logins: 5        # then block the account for 10 minutes
        seconds_before_next_try: 600
  
  # HTTPS via Traefik: templates/httproute.yaml routes jupyter.germanium.cz to proxy-public.
  # No LoadBalancer IP any more (it served plain HTTP on 172.31.1.38).
  proxy:
    service:
      type: ClusterIP


  prePuller:
    hook:
      enabled: false
    continuous:
      enabled: false

  singleuser:
    storage:
      dynamic:
        storageClass: nfs-atlas

  scheduling:
    # The user scheduler packs user pods onto as few nodes as possible, for autoscaling clusters.
    # Not useful on 3 fixed nodes; its 2 replicas renewed a lease every 2 s (about 0.5 etcd writes/s).
    # User pods and the placeholder use the default scheduler instead.
    userScheduler:
      enabled: false
    userPlaceholder:
      replicas: 1
