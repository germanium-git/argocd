# HTTPS route on the Cloudflare Tunnel gateway: remote access through the tunnel (behind the
# Cloudflare Access app "jupyter"), LAN access via the SRX300 DNS entry jupyter.germanium.cz ->
# 172.31.1.34. TLS uses the germanium.cz wildcard cert on the gateway. Traefik and Cloudflare
# pass the WebSocket connections the notebooks need.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jupyterhub-https
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-tls-tunnel
      namespace: traefik
      sectionName: websecure
  hostnames:
    - jupyter.germanium.cz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: proxy-public
          port: 80
          weight: 1
