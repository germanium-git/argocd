apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jupyterhub
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: argo
    notifications.argoproj.io/subscribe.on-health-degraded.slack: argo
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argo
    notifications.argoproj.io/subscribe.on-sync-status-unknown.slack: argo
spec:
  project: default
  
  sources:
  - repoURL: https://github.com/germanium-git/argocd
    path: apps/jupyterhub
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml

  # - repoURL: https://github.com/germanium-git/argocd/
  #   path: apps/jupyterhub/addons
  #   targetRevision: main

  destination:
    namespace: jhub
    server: https://kubernetes.default.svc
  
  # z2jh generates hub secrets with Helm `lookup`, which Argo CD does not support,
  # so every render produces new random values. Ignore them and never overwrite the
  # live ones (rotating them would log everyone out and break encrypted auth state).
  ignoreDifferences:
  - kind: Secret
    name: hub
    namespace: jhub
    jsonPointers:
    - /data/hub.config.ConfigurableHTTPProxy.auth_token
    - /data/hub.config.CryptKeeper.keys
    - /data/hub.config.JupyterHub.cookie_secret
  - group: apps
    kind: Deployment
    name: hub
    namespace: jhub
    jsonPointers:
    - /spec/template/metadata/annotations/checksum~1secret
  - group: apps
    kind: Deployment
    name: proxy
    namespace: jhub
    jsonPointers:
    - /spec/template/metadata/annotations/checksum~1auth-token

  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
