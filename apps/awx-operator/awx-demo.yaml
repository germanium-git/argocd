---
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx-demo
  namespace: awx
spec:
  # Exposed via HTTPRoute awx-https (https://awx.germanium.cz) on traefik-gateway-tls, see values.yaml.
  # Note: this AWX CR is applied manually (kubectl apply -f awx-demo.yaml), it is not rendered by the chart.
  service_type: ClusterIP
  # Secret to connect to external Postgres
  postgres_configuration_secret: awx-demo-postgres-configuration
