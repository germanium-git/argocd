apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash-bot
  labels:
    app: stash-bot
spec:
  replicas: 1 # never more: Hermes must not run two gateways on one data dir
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stash-bot
  template:
    metadata:
      labels:
        app: stash-bot
    spec:
      # Init order: render-config → notion-mcp → sheets-mcp → (main) hermes.
      # The MCP servers are native sidecars (restartPolicy: Always): each must pass its startupProbe
      # before the next one starts, so Hermes never boots against MCP servers that are not listening yet.
      initContainers:
        # Render config.yaml (inject the sidecar's bearer token) and copy SOUL.md into the data dir.
        - name: render-config
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -eu
              sed "s|__MCP_AUTH_TOKEN__|${MCP_AUTH_TOKEN}|g" /config/config.yaml > /opt/data/config.yaml
              cp /config/SOUL.md /opt/data/SOUL.md
              chmod 600 /opt/data/config.yaml
              chown 10000:10000 /opt/data /opt/data/config.yaml /opt/data/SOUL.md
          env:
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stash-bot-secrets
                  key: MCP_AUTH_TOKEN
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config
              readOnly: true

        # Notion MCP server (Streamable HTTP, bearer auth), localhost only.
        - name: notion-mcp
          image: mcp/notion:latest@sha256:df0d6781d03f37bd5b962c85ae1f288382f31b7108c489473641ffc372f43dc9
          restartPolicy: Always
          args: ["--transport", "http", "--port", "3000", "--host", "127.0.0.1"]
          env:
            - name: NOTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stash-bot-secrets
                  key: NOTION_TOKEN
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stash-bot-secrets
                  key: MCP_AUTH_TOKEN
          startupProbe:
            tcpSocket:
              host: 127.0.0.1
              port: 3000
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp

        # Google Sheets MCP server (xing5/mcp-google-sheets), localhost only.
        # Auth: service account JSON (base64) in CREDENTIALS_CONFIG; the SA is an Editor on the
        # "Aircraft Kits" spreadsheet only. No HTTP auth, so it must stay bound to 127.0.0.1.
        # mcp<2: mcp-google-sheets 0.6.3 imports mcp.server.fastmcp, which mcp 2.x renamed.
        - name: sheets-mcp
          image: ghcr.io/astral-sh/uv:0.9.7-python3.12-bookworm-slim
          restartPolicy: Always
          command: ["uvx", "--with", "mcp<2", "mcp-google-sheets@0.6.3", "--transport", "streamable-http"]
          env:
            - name: HOST
              value: "127.0.0.1"
            - name: PORT
              value: "8001"
            - name: HOME
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: DRIVE_FOLDER_ID
              value: 1fsEfJj_dY5iJtILeHud_TSc9Yx_krAOC
            - name: ENABLED_TOOLS
              value: list_sheets,get_sheet_data,get_multiple_sheet_data,find_in_spreadsheet,add_rows,update_cells,batch_update_cells,create_sheet
            - name: CREDENTIALS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: stash-bot-secrets
                  key: GOOGLE_SA_JSON_B64
          startupProbe:
            tcpSocket:
              host: 127.0.0.1
              port: 8001
            periodSeconds: 3
            failureThreshold: 100 # first start downloads ~50 packages from PyPI
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          args: ["gateway", "run"]
          # Only the keys Hermes needs; Notion/Google credentials stay in their sidecars.
          env:
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: stash-bot-secrets, key: SLACK_BOT_TOKEN}
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef: {name: stash-bot-secrets, key: SLACK_APP_TOKEN}
            - name: SLACK_ALLOWED_USERS
              valueFrom:
                secretKeyRef: {name: stash-bot-secrets, key: SLACK_ALLOWED_USERS}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: stash-bot-secrets, key: ANTHROPIC_API_KEY}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stash-bot-data
        - name: config
          configMap:
            name: stash-bot-config
        - name: tmp
          emptyDir: {}
