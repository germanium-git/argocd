n8n:
  # The key encrypts the credentials n8n stores. It comes from SealedSecret
  # addons/n8n-encryption-key-sealedsecret.yaml (Secret n8n-encryption-key, key N8N_ENCRYPTION_KEY).
  # It was rotated on 2026-11-20 because the previous key was in this public repo; a copy of the
  # new key is in Bitwarden ("n8n encryption key"). Losing it makes stored credentials unreadable.
  existingEncryptionKeySecret: n8n-encryption-key

  timezone: Europe/Prague

  # SQLite on an NFS volume: never run two n8n pods at once. With RollingUpdate the new pod
  # can't open the database (SQLITE_PROTOCOL) while the old one holds it, and the rollout hangs.
  strategy:
    type: Recreate

  main:
    extraEnvVars:
      # Traefik is the one proxy in front of n8n; lets the login rate limiter trust X-Forwarded-For.
      # (N8N_TRUST_PROXY, used before, is not an n8n setting.)
      N8N_PROXY_HOPS: "1"
      # The chart derived this from the Ingress; set it explicitly now that n8n uses an HTTPRoute
      N8N_EDITOR_BASE_URL: "https://n8n.germanium.cz"

    persistence:
      enabled: true
      storageClass: "nfs-atlas"
      size: 8Gi
      accessMode: ReadWriteOnce

  # Replaced by addons/httproute-https.yaml (Gateway API, Cloudflare Tunnel gateway)
  ingress:
    enabled: false
