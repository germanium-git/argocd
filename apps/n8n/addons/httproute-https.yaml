# HTTPS route on the Cloudflare Tunnel gateway: remote access through the tunnel
# (behind Cloudflare Access), LAN access via the SRX300 DNS entry
# n8n.germanium.cz -> 172.31.1.34. TLS uses the germanium.cz wildcard cert on the
# gateway, so the old per-app certificate is no longer needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-https
  namespace: n8n
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-tls-tunnel
      namespace: traefik
      sectionName: websecure
  hostnames:
    - n8n.germanium.cz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: n8n
          port: 5678
          weight: 1
