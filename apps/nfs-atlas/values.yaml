nfs-subdir-external-provisioner:
  nfs:
    server: 172.31.1.6
    path: /volume1/nfs
  storageClass:
    create: true
    # Matches the live cluster: nfs-atlas has been the default StorageClass since it replaced nfs-client.
    defaultClass: true
    name: nfs-atlas
    # Keep the data when a PVC is deleted; the PV goes to "Released" and is cleaned up by hand
    # (see readme.md). With Retain, archiveOnDelete has no effect.
    reclaimPolicy: Retain
    archiveOnDelete: false
  podSecurityContext:
    runAsUser: 1002       # k8s-orange user
    runAsGroup: 1000      # k8s-nfs-group
    fsGroup: 1000         # k8s-nfs-group
  # One replica with the Recreate strategy, so there is never a second provisioner to elect against.
  # Leader election renewed an Endpoints object every 2 s, about 0.5 etcd writes/s on orange1.
  leaderElection:
    enabled: false
