paperless-ngx:
  env:
    TZ: Europe/Prague
    PAPERLESS_ADMIN_USER: admin
    PAPERLESS_DBHOST: paperless-postgres
    PAPERLESS_DBNAME: paperless
    PAPERLESS_DBUSER: paperless
    PAPERLESS_DBPASS:
      valueFrom:
        secretKeyRef:
          name: paperless-postgresql
          key: password
    PAPERLESS_REDIS: redis://paperless-redis:6379
    # Ingress replaced by a Gateway API HTTPRoute (apps/paperless/addons), attached to the
    # shared traefik-gateway-tls-tunnel Gateway. Disabling ingress.main drops the chart's
    # auto-derived PAPERLESS_URL (see templates/common.yaml), so it's set explicitly here to
    # preserve CSRF trusted-origin behavior behind the proxy.
    PAPERLESS_URL: https://paperless.germanium.cz

  envFrom:
    - secretRef:
        name: paperless-secrets

  ingress:
    main:
      enabled: false

  persistence:
    data:
      enabled: true
      storageClass: nfs-atlas
      accessMode: ReadWriteOnce
      size: 10Gi
    media:
      enabled: true
      storageClass: nfs-atlas
      accessMode: ReadWriteOnce
      size: 20Gi
    export:
      enabled: true
      storageClass: nfs-atlas
      accessMode: ReadWriteOnce
      size: 5Gi
    consume:
      enabled: true
      storageClass: nfs-atlas
      accessMode: ReadWriteOnce
      size: 5Gi

  postgresql:
    enabled: false

  redis:
    enabled: false
