apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless-https
  namespace: paperless
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: traefik-gateway-tls-tunnel
      namespace: traefik
      sectionName: websecure
  hostnames:
    - paperless.germanium.cz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: paperless-paperless-ngx
          port: 8000
          weight: 1
