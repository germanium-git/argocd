apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: argo
    notifications.argoproj.io/subscribe.on-health-degraded.slack: argo
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argo
    notifications.argoproj.io/subscribe.on-sync-status-unknown.slack: argo
  name: cert-manager
  namespace: argocd
spec:
  project: default
  
  sources:
  - repoURL: https://github.com/germanium-git/argocd
    path: apps/cert-manager
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml


  - repoURL: https://github.com/germanium-git/argocd/
    path: apps/cert-manager/addons
    targetRevision: main

  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc

  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /status
    jqPathExpressions:
    - .spec.versions[].selectableFields

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true
