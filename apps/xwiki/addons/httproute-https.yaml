---
# HTTPS route on the Cloudflare Tunnel gateway: reachable remotely through the
# tunnel (behind Cloudflare Access) and on the LAN via the SRX300 DNS proxy entry
# wiki.germanium.cz -> 172.31.1.34. TLS uses the germanium.cz wildcard cert.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xwiki-https
  namespace: xwiki
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-tls-tunnel
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "wiki.germanium.cz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: xwiki
          port: 80
          weight: 1
