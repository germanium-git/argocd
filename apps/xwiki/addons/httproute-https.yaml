---
# LAN-only HTTPS route; TLS is terminated at the shared traefik-gateway-tls
# listener using the germanium.cz wildcard cert (covers wiki.germanium.cz).
# To expose it publicly via the Cloudflare Tunnel instead, attach it to
# traefik-gateway-tls-tunnel (see apps/paperless/addons/httproute-https.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xwiki-https
  namespace: xwiki
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-tls
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "wiki.germanium.cz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: xwiki
          port: 80
          weight: 1
