xwiki:
  # The chart only auto-selects the image variant for its bundled DBs, so with an
  # external DB the tag must be set explicitly. 17.10.x is the current LTS line.
  # Dependabot (docker ecosystem) only recognises image.repository + image.tag, while the
  # chart reads image.name. `repository` is ignored by the chart and only lets Dependabot
  # bump `tag`. Dependabot is restricted to the LTS line (see .github/dependabot.yml).
  image:
    repository: xwiki
    name: xwiki
    tag: 1.7.4

  # Bundled Bitnami subcharts are disabled (Bitnami removed most tags from Docker Hub,
  # same issue as paperless). Standalone PostgreSQL is deployed from addons/postgresql.yaml.
  mysql:
    enabled: false
  mariadb:
    enabled: false
  postgresql:
    enabled: false

  externalDB:
    type: postgresql
    host: xwiki-postgres
    database: xwiki
    user: xwiki
    customKeyRef:
      enabled: true
      name: xwiki-postgresql
      key: password

  # Wait for PostgreSQL before starting XWiki
  initContainers:
    database:
      enabled: true
      # The chart only derives this image for its bundled DBs
      image: postgres:18-alpine

  # XWiki permanent directory (extensions, attachments cache, Solr index, logs)
  persistence:
    enabled: true
    storageClass: nfs-atlas
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  # The embedded Solr index on NFS can be slow; XWiki is a JVM app, give it room.
  # 3Gi limit with a 2g heap was OOMKilled while installing the Standard Flavor:
  # metaspace, embedded Solr and thread stacks need ~1.5-2Gi on top of the heap.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 5Gi
  javaOpts:
    - "-Xmx3072m"

  # TLS is terminated at the Traefik gateway; make XWiki generate https:// URLs.
  customConfigs:
    xwiki.cfg:
      xwiki.url.protocol: https
      xwiki.home: https://wiki.germanium.cz/

  ingress:
    enabled: false
