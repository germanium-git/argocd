---
# HTTP -> HTTPS redirect (LAN only). Ignored by external-dns: the DNS record comes
# from esphome-https, and this route would otherwise publish a second, conflicting
# A record with the local IP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome-http-redirect
  namespace: esphome
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - "esphome.germanium.cz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
