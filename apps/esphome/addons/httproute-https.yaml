---
# HTTPS route on the Cloudflare Tunnel gateway (remote access behind Cloudflare
# Access; on the LAN the SRX300 resolves esphome.germanium.cz to 172.31.1.34).
# TLS uses the germanium.cz wildcard cert.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome-https
  namespace: esphome
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway-tls-tunnel
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "esphome.germanium.cz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: esphome
          port: 6052
          weight: 1
